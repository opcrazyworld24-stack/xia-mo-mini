<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="./manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>XIA MO - TITAN WAR</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#030615;color:white;font-family:Arial;overflow:hidden;touch-action:none}
canvas{width:100vw;height:100dvh;display:block}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;font-size:13px;font-weight:bold;color:#00eaff;text-shadow:0 0 9px #00eaff;pointer-events:none}
#bossBox{position:absolute;top:52px;left:15%;width:70%;text-align:center;display:none;color:#ff466d;font-weight:bold;font-size:12px}
#bossBar{height:12px;background:#25101b;border:1px solid #ff466d;border-radius:10px;overflow:hidden;margin-top:5px}
#bossHealth{height:100%;width:100%;background:linear-gradient(90deg,#ff1744,#ff9d00)}
#controls{position:absolute;bottom:22px;left:0;right:0;display:flex;align-items:center;justify-content:space-around;padding:0 10px}
.ctrl{width:68px;height:68px;border-radius:20px;border:2px solid #00eaff;background:linear-gradient(145deg,#142c55,#050b22);color:#00eaff;box-shadow:0 0 15px #00cfff66,inset 0 0 12px #00cfff44;display:flex;align-items:center;justify-content:center;user-select:none}
.ctrl:active{background:#006a91;transform:scale(.92)}
.ctrl svg{width:38px;height:38px}
#rocket{width:82px;height:82px;border-color:#ff42a1;box-shadow:0 0 22px #ff168866,inset 0 0 15px #ff168844;background:linear-gradient(145deg,#4a1245,#10091f)}
#rocket svg{width:52px;height:52px}
#auto{position:absolute;bottom:104px;left:50%;transform:translateX(-50%);font-size:10px;color:#00ffcf;letter-spacing:3px;text-shadow:0 0 10px #00ffcf;pointer-events:none}
#screen{position:absolute;inset:0;background:#020514eF;display:flex;align-items:center;justify-content:center;text-align:center}
.panel{width:88%;max-width:390px;padding:28px 18px;border:1px solid #00eaff;border-radius:20px;background:linear-gradient(145deg,#101d43,#080b20);box-shadow:0 0 35px #007bff77}
h1{font-size:32px;color:#00eaff;text-shadow:0 0 18px #00eaff}
h2{color:#ff42a1;letter-spacing:4px}
.start{padding:14px 36px;border:1px solid #00eaff;border-radius:10px;background:linear-gradient(90deg,#006cff,#a000ff);color:white;font-weight:bold;font-size:17px}
.small{color:#9eb9e9;font-size:12px}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
 <span>XIA MO ⚡</span>
 <span>SCORE: <span id="score">0</span></span>
 <span>HP: <span id="lives">3</span></span>
</div>

<div id="bossBox">TITAN X - BOSS
 <div id="bossBar"><div id="bossHealth"></div></div>
</div>

<div id="auto">AUTO FIRE SYSTEM : ONLINE</div>

<div id="controls">
 <button class="ctrl" id="left" aria-label="Left">
  <svg viewBox="0 0 50 50" fill="none" stroke="#00eaff" stroke-width="3">
   <path d="M29 8 L12 25 L29 42 M13 25 H40"/>
  </svg>
 </button>

 <button class="ctrl" id="rocket" aria-label="Rocket">
  <svg viewBox="0 0 60 60" fill="none" stroke="#ff59b3" stroke-width="2.5">
   <path d="M30 5 Q47 17 39 39 L30 48 L21 39 Q13 17 30 5Z" fill="#9b185e"/>
   <circle cx="30" cy="25" r="6" fill="#00eaff"/>
   <path d="M21 33 L9 43 L21 44 M39 33 L51 43 L39 44" fill="#76184c"/>
   <path d="M25 46 L30 58 L35 46" fill="#ff9d00"/>
   <path d="M30 49 L30 57" stroke="#ffff00"/>
  </svg>
 </button>

 <button class="ctrl" id="right" aria-label="Right">
  <svg viewBox="0 0 50 50" fill="none" stroke="#00eaff" stroke-width="3">
   <path d="M21 8 L38 25 L21 42 M10 25 H37"/>
  </svg>
 </button>
</div>

<div id="screen">
 <div class="panel">
  <h1>XIA MO</h1>
  <h2>TITAN WAR</h2>
  <p id="message">THE GALAXY NEEDS YOU</p>
  <p class="small">Destroy enemy fighters. Defeat the TITAN X boss.</p>
  <button class="start" id="start">START MISSION</button>
 </div>
</div>

<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
let W,H,player,enemies,shots,enemyShots,rockets,particles,stars,boss;
let score,lives,kills,frame,running=false;
let keys={left:false,right:false};

function resize(){
 W=c.width=innerWidth;
 H=c.height=innerHeight;
}
resize();window.addEventListener("resize",resize);

function reset(){
 score=0;lives=3;kills=0;frame=0;
 player={x:W/2,y:H-135};
 enemies=[];shots=[];enemyShots=[];rockets=[];particles=[];
 boss=null;
 stars=Array.from({length:110},()=>({
  x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.5
 }));
 hud();
}

function hud(){
 document.getElementById("score").textContent=score;
 document.getElementById("lives").textContent=lives;
}

function explosion(x,y,color){
 for(let i=0;i<35;i++){
  particles.push({
   x,y,vx:(Math.random()-.5)*8,
   vy:(Math.random()-.5)*8,life:40,color
  });
 }
}

function ship(x,y,color,size=1){
 ctx.save();ctx.translate(x,y);ctx.scale(size,size);
 ctx.shadowBlur=22;ctx.shadowColor=color;
 ctx.fillStyle="#101e3f";ctx.strokeStyle=color;ctx.lineWidth=3;
 ctx.beginPath();
 ctx.moveTo(0,-27);ctx.lineTo(19,12);
 ctx.lineTo(8,8);ctx.lineTo(0,19);
 ctx.lineTo(-8,8);ctx.lineTo(-19,12);
 ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle=color;
 ctx.fillRect(-3,-9,6,17);
 ctx.restore();ctx.shadowBlur=0;
}

function spawnEnemy(){
 enemies.push({
  x:40+Math.random()*(W-80),
  y:-40,hp:3,speed:1.7+Math.random()*1.5,cool:65
 });
}

function fire(){
 shots.push({x:player.x,y:player.y-25,vy:-10});
}

function launchRocket(){
 if(!running)return;
 if(rockets.length>=3)return;
 rockets.push({x:player.x,y:player.y-30,vy:-9});
}

function hit(){
 lives--;hud();
 explosion(player.x,player.y,"#00eaff");
 if(lives<=0)finish(false);
}

function finish(win){
 running=false;
 document.getElementById("screen").style.display="flex";
 document.getElementById("message").textContent=
 win?"TITAN X DESTROYED! VICTORY!":"MISSION FAILED - SCORE "+score;
 document.getElementById("start").textContent="PLAY AGAIN";
}

function update(){
 if(!running)return;
 frame++;

 ctx.fillStyle="#030615";ctx.fillRect(0,0,W,H);

 stars.forEach(s=>{
  s.y+=s.s;
  if(s.y>H){s.y=0;s.x=Math.random()*W}
  ctx.fillStyle="#8adfff";ctx.fillRect(s.x,s.y,2,2);
 });

 if(keys.left)player.x-=5;
 if(keys.right)player.x+=5;
 player.x=Math.max(25,Math.min(W-25,player.x));

 // PLAYER
 ship(player.x,player.y,"#00eaff",1.15);

 // AUTO FIRE ALWAYS ON
 if(frame%8===0)fire();

 // ENEMIES
 if(!boss && kills<10 && frame%60===0)spawnEnemy();

 for(let i=enemies.length-1;i>=0;i--){
  let e=enemies[i];e.y+=e.speed;e.cool--;
  ship(e.x,e.y,"#ff2877",.9);
  if(e.cool<=0){
   enemyShots.push({x:e.x,y:e.y+15,vy:4});
   e.cool=85;
  }
  if(e.y>H+30){enemies.splice(i,1);continue}
  if(Math.abs(e.x-player.x)<24&&Math.abs(e.y-player.y)<25){
   enemies.splice(i,1);hit();continue;
  }
 }

 // PLAYER ENERGY SHOTS
 for(let i=shots.length-1;i>=0;i--){
  let b=shots[i];b.y+=b.vy;
  ctx.shadowBlur=15;ctx.shadowColor="#00eaff";
  ctx.fillStyle="#00ffff";ctx.fillRect(b.x-3,b.y,6,18);
  ctx.shadowBlur=0;
  if(b.y<0)shots.splice(i,1);
 }

 // ROCKETS
 for(let i=rockets.length-1;i>=0;i--){
  let r=rockets[i];r.y+=r.vy;
  ctx.save();ctx.translate(r.x,r.y);
  ctx.shadowBlur=18;ctx.shadowColor="#ff42a1";
  ctx.fillStyle="#ff42a1";
  ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(8,8);
  ctx.lineTo(0,14);ctx.lineTo(-8,8);ctx.closePath();ctx.fill();
  ctx.fillStyle="#00eaff";ctx.fillRect(-3,-4,6,9);
  ctx.fillStyle="#ff9d00";ctx.fillRect(-3,14,6,10);
  ctx.restore();
  if(r.y<-30)rockets.splice(i,1);
 }

 // ENEMY HIT
 for(let i=enemies.length-1;i>=0;i--){
  let e=enemies[i],dead=false;
  for(let j=shots.length-1;j>=0;j--){
   let b=shots[j];
   if(Math.abs(e.x-b.x)<22&&Math.abs(e.y-b.y)<27){
    e.hp--;shots.splice(j,1);
    if(e.hp<=0)dead=true;
    break;
   }
  }
  for(let j=rockets.length-1;j>=0;j--){
   let r=rockets[j];
   if(Math.abs(e.x-r.x)<30&&Math.abs(e.y-r.y)<35){
    dead=true;rockets.splice(j,1);break;
   }
  }
  if(dead){
   explosion(e.x,e.y,"#ff2877");
   enemies.splice(i,1);score+=100;kills++;hud();
  }
 }

 // BOSS ARRIVAL
 if(kills>=10&&!boss){
  boss={x:W/2,y:105,hp:120,max:120,dir:1,cool:40};
  document.getElementById("bossBox").style.display="block";
 }

 // TITAN X BOSS
 if(boss){
  boss.x+=boss.dir*2.2;
  if(boss.x>W-75||boss.x<75)boss.dir*=-1;
  boss.cool--;

  ctx.save();ctx.translate(boss.x,boss.y);
  ctx.shadowBlur=30;ctx.shadowColor="#ff1744";
  ctx.fillStyle="#34102e";ctx.strokeStyle="#ff315c";ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(-65,-25);ctx.lineTo(-45,-52);
  ctx.lineTo(-20,-42);ctx.lineTo(20,-42);
  ctx.lineTo(45,-52);ctx.lineTo(65,-25);
  ctx.lineTo(52,32);ctx.lineTo(0,55);ctx.lineTo(-52,32);
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle="#ff1744";
  ctx.fillRect(-33,-12,19,9);ctx.fillRect(14,-12,19,9);
  ctx.restore();ctx.shadowBlur=0;

  if(boss.cool<=0){
   [-1,0,1].forEach(n=>{
    enemyShots.push({x:boss.x+n*30,y:boss.y+45,vy:5});
   });
   boss.cool=38;
  }

  for(let i=shots.length-1;i>=0;i--){
   let b=shots[i];
   if(Math.abs(b.x-boss.x)<68&&Math.abs(b.y-boss.y)<55){
    boss.hp-=2;shots.splice(i,1);
   }
  }
  for(let i=rockets.length-1;i>=0;i--){
   let r=rockets[i];
   if(Math.abs(r.x-boss.x)<75&&Math.abs(r.y-boss.y)<65){
    boss.hp-=15;rockets.splice(i,1);
    explosion(boss.x,boss.y,"#ff9d00");
   }
  }
  document.getElementById("bossHealth").style.width=
   Math.max(0,boss.hp/boss.max*100)+"%";

  if(boss.hp<=0){
   explosion(boss.x,boss.y,"#ff9d00");
   score+=1000;hud();boss=null;
   document.getElementById("bossBox").style.display="none";
   finish(true);
  }
 }

 // BOSS AND ENEMY PROJECTILES
 for(let i=enemyShots.length-1;i>=0;i--){
  let b=enemyShots[i];b.y+=b.vy;
  ctx.shadowBlur=14;ctx.shadowColor="#ff315c";
  ctx.fillStyle="#ff315c";
  ctx.beginPath();ctx.arc(b.x,b.y,5,0,7);ctx.fill();
  ctx.shadowBlur=0;
  if(b.y>H){enemyShots.splice(i,1);continue}
  if(Math.abs(b.x-player.x)<20&&Math.abs(b.y-player.y)<22){
   enemyShots.splice(i,1);hit();
  }
 }

 for(let i=particles.length-1;i>=0;i--){
  let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;
  ctx.globalAlpha=Math.max(0,p.life/40);
  ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4);
  ctx.globalAlpha=1;
  if(p.life<=0)particles.splice(i,1);
 }

 requestAnimationFrame(update);
}

function bind(id,key){
 let el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();keys[key]=true;
 });
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>{
  el.addEventListener(ev,()=>keys[key]=false);
 });
}
bind("left","left");bind("right","right");

document.getElementById("rocket").addEventListener("pointerdown",e=>{
 e.preventDefault();launchRocket();
});

document.getElementById("start").onclick=()=>{
 reset();
 document.getElementById("screen").style.display="none";
 document.getElementById("bossBox").style.display="none";
 running=true;update();
};

window.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")keys.left=true;
 if(e.key==="ArrowRight")keys.right=true;
 if(e.key===" " )launchRocket();
});
window.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft")keys.left=false;
 if(e.key==="ArrowRight")keys.right=false;
});
</script>
</body>
</html>
